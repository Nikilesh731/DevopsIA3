name: Deploy - Production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      ENABLE_GHCR_PUSH: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Terraform CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform

      - name: Log in to GHCR
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          echo "${{ github.token }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Build and push production Docker images
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          IMAGE_NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 -f services/gateway-service/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f region-service/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/region-service:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f simulation-service/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/simulation-service:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f resource-service/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/resource-service:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f fault-service/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/fault-service:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f services/event-bus/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/event-bus:${IMAGE_TAG} --push .
          docker buildx build --platform linux/amd64 -f frontend/Dockerfile -t ${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG} --push .
          echo "Image tag: ${IMAGE_TAG}"
          echo "✓ All images built and pushed"

      - name: Build production Docker images (no push)
        if: env.ENABLE_GHCR_PUSH != 'true'
        run: |
          docker compose build
          echo "::warning::ENABLE_GHCR_PUSH is not 'true'; built images locally without registry push."

      - name: Validate Infrastructure as Code
        run: |
          cd infra/terraform
          rm -rf .terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Setup kubectl
        if: env.ENABLE_GHCR_PUSH == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "::warning::KUBE_CONFIG_DATA env var is empty; skipping kubeconfig setup."
            exit 0
          fi
          mkdir -p ~/.kube
          printf "%s" "${KUBE_CONFIG_DATA}" | tr -d '\r\n' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to production cluster
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          if [ ! -f ~/.kube/config ]; then
            echo "::warning::kubeconfig not configured; skipping cluster deployment."
            exit 0
          fi
          IMAGE_NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${GITHUB_SHA}"
          kubectl apply -f infra/kubernetes/namespace.yaml
          kubectl apply -f infra/kubernetes/configmap.yaml
          kubectl apply -f infra/kubernetes/services.yaml
          kubectl apply -f infra/kubernetes/deployments.yaml

          kubectl -n epidemic-system set image deployment/gateway-service gateway-service=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/gateway-service:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/region-service region-service=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/region-service:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/simulation-service simulation-service=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/simulation-service:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/resource-service resource-service=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/resource-service:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/fault-service fault-service=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/fault-service:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/event-bus event-bus=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/event-bus:${IMAGE_TAG}
          kubectl -n epidemic-system set image deployment/frontend frontend=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}

      - name: Skip cluster deployment when registry push is disabled
        if: env.ENABLE_GHCR_PUSH != 'true'
        run: |
          echo "::warning::Set repository variable ENABLE_GHCR_PUSH=true to enable end-to-end production rollout."

      - name: Verify production deployment
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          if [ ! -f ~/.kube/config ]; then
            echo "::warning::kubeconfig not configured; skipping rollout checks."
            exit 0
          fi
          kubectl -n epidemic-system rollout status deployment/gateway-service --timeout=180s
          kubectl -n epidemic-system rollout status deployment/region-service --timeout=180s
          kubectl -n epidemic-system rollout status deployment/simulation-service --timeout=180s
          kubectl -n epidemic-system rollout status deployment/resource-service --timeout=180s
          kubectl -n epidemic-system rollout status deployment/fault-service --timeout=180s
          kubectl -n epidemic-system rollout status deployment/event-bus --timeout=180s
          kubectl -n epidemic-system rollout status deployment/frontend --timeout=180s

      - name: Post-deployment validation
        if: env.ENABLE_GHCR_PUSH == 'true'
        run: |
          if [ ! -f ~/.kube/config ]; then
            echo "::warning::kubeconfig not configured; skipping kubectl validation."
            exit 0
          fi
          kubectl -n epidemic-system get pods
          kubectl -n epidemic-system get services

      - name: Notify deployment
        if: always()
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "Deployment notification"
          echo "Status: ${{ job.status }}"
          echo "Image tag: ${IMAGE_TAG}"
